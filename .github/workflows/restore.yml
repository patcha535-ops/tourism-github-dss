name: restore-structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and clean up
        run: |
          unzip -o "*.zip"
          rm -f *.zip

      - name: Commit and push restored files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add -A
          git commit -m "Restore folder structure from bundle" || echo "No changes to commit"
          git push
